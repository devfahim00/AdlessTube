name: adlesstube
description: "An ad-free YouTube client built with Flutter and NewPipe Extractor."
publish_to: 'none'
version: 2.2.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # NewPipe Extractor (YouTube data scraping)
  newpipeextractor_dart: ^2.0.2

  # Video playback (libmpv based, better YouTube support than video_player)
  media_kit: ^1.1.10
  media_kit_video: ^1.3.1
  media_kit_libs_video: ^1.0.4
  android_pip: ^2.0.2
  audio_service: ^0.18.19
  just_audio: ^0.10.5

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State management
  provider: ^6.1.2

  # UI helpers
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.1
  package_info_plus: 8.0.2

  # Local file paths for downloads
  path_provider: ^2.1.4
  # Native share sheet (video links, data backups)
  share_plus: ^10.0.0
  # System file picker (import data backups)
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  path_provider_platform_interface: ^2.1.0

# ⚠️ এটা main fix — package_info_plus 9.x আপনার Gradle-এ fail করছিল
# 7.0.0 stable এবং media_kit-এর সাথে compatible
dependency_overrides:
  package_info_plus: 8.0.2
  screen_brightness_android: 2.0.0
  wakelock_plus: 1.2.10 

flutter:
  uses-material-design: true
