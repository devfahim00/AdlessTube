plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.adlesstube"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // ⬇️ এই লাইন যোগ করুন — Java 8+ API desugaring
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.adlesstube"
        minSdk = 22
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Optional — multiDex সাপোর্ট (বড় প্রজেক্টের জন্য ভালো)
        multiDexEnabled = true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

// ⬇️ এই block-টা file-এর শেষে যোগ করুন (android {} block-এর বাইরে)
dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
